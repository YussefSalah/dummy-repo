<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Electronics - Premium Store</title>
    <meta name="description" content="Discover premium electronics with Nexus.">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="toast-container"></div>
    
    <nav class="navbar">
        <div class="logo">
            <div class="logo-icon"></div>
            <h1>Nexus</h1>
        </div>
        <div class="nav-links">
            <button class="nav-btn" id="view-orders-btn">My Orders</button>
            <div class="cart-icon" id="cart-total-btn">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="9" cy="21" r="1"></circle>
                    <circle cx="20" cy="21" r="1"></circle>
                    <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                </svg>
                <span class="cart-badge">3</span>
            </div>
        </div>
    </nav>

    <main class="container">
        <header class="hero">
            <div class="hero-content">
                <h2>The Future of Audio</h2>
                <p>Experience crystal-clear sound with our latest premium headphones, now with active noise cancellation.</p>
                <button class="primary-btn" id="featured-btn">View Featured Product</button>
            </div>
        </header>

        <section class="grid-section">
            <div class="card registration-card">
                <h3>Join Nexus</h3>
                <p>Create an account to track your orders.</p>
                <form id="register-form">
                    <div class="input-group">
                        <input type="text" id="reg-name" placeholder="Full Name" required>
                    </div>
                    <div class="input-group">
                        <input type="email" id="reg-email" placeholder="Email Address" required>
                    </div>
                    <button type="submit" class="secondary-btn w-full">Create Account</button>
                </form>
            </div>

            <div class="card checkout-card">
                <h3>Quick Checkout</h3>
                <p>Complete your purchase securely.</p>
                <div class="price-summary">
                    <span>Total:</span>
                    <span class="price-value">$999.00</span>
                </div>
                <button class="primary-btn w-full pulse-animation" id="checkout-btn">Pay Now</button>
            </div>
        </section>

        <!-- Response Data Display Area -->
        <section class="terminal-card">
            <div class="terminal-header">
                <div class="terminal-dots">
                    <span></span><span></span><span></span>
                </div>
                <span>Server Response</span>
            </div>
            <pre id="response-output">Awaiting user interaction...</pre>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
